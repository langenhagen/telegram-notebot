# Copy to config.toml and fill in your values.

# File (outside this repo) that contains just the bot token on one line.
# Store it wherever you like, e.g.:
#   printf '%s\n' '123456:ABC-your-token' > /path/to/your/token-file
token_file = "/path/to/your/token-file"

[whisper]
model = "large-v3"
device = "cpu"          # auto | cpu | cuda; see Troubleshooting for GPU notes
compute_type = "int8"   # int8_float16 is GPU-only

[channels]
# One [channels."<Telegram channel ID>"] section per channel, with:
# `file`: the markdown file for this channel's notes. Missing directory trees are created.
# `template`: the file that formats each note block; see message_templates/ folder.
# `keep_audio`:
#   - true archives audio uploads next to `file`.
#   - false deletes an upload once it is transcribed (failed ones are kept).
#
# Relative paths resolve against the working directory; ~ is expanded.
# Post anything into a channel while the bot runs to see unmapped IDs in the log.

[channels."-1001234567890"]
file = "~/Notes/telegram/cookbook.md"
template = "message_templates/default.tpl"
keep_audio = true

[channels."-1009876543210"]
file = "/home/me/Documents/meeting-notes/protocol.md"
template = "~/Notes/meeting.tpl"
keep_audio = false
