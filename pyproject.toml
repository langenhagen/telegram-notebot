[project]
name = "telegram-notebot"
version = "0.1.0"
description = "Telegram bot that stores channel posts as markdown notes, transcribing audio with Whisper."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper>=1.2,<2",
    "python-telegram-bot>=22,<23",
]

[project.scripts]
notebot = "notebot.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pylint>=4.0.7",
    "pytest>=8",
    "ruff>=0.16",
]

[tool.uv]
exclude-newer = "10 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notebot"]
